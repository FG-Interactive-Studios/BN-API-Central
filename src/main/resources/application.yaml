spring:
  application:
    name: BatalhaNaval
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/battleship}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

auth:
  jwt:
    secret-base64: ${AUTH_JWT_SECRET_B64:}

server:
  port: ${PORT:8080}

# Empty means same-origin WebSocket handshakes only.
# For a frontend on another origin, set REALTIME_ALLOWED_ORIGINS explicitly.
realtime:
  allowed-origins: ${REALTIME_ALLOWED_ORIGINS:}

# MVP: WebSocket presence-based reconnect grace during an active battle.
# A broken connection alone never gives an immediate win. Scope: one API instance.
match:
  disconnect-grace-seconds: ${MATCH_DISCONNECT_GRACE_SECONDS:120}
  disconnect-sweep-ms: ${MATCH_DISCONNECT_SWEEP_MS:5000}
